name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag im Format v<VERSION>, passend zu version.json"
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Lädt die gesamte Historie

    - name: Validate release authorization and version
      id: validate-release
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        REF_SHA: ${{ github.sha }}
        RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      run: |
        if ($env:EVENT_NAME -eq "push") {
          $releaseTag = $env:REF_NAME
          $branches = @(git branch --remotes --contains $env:REF_SHA | ForEach-Object { $_.Trim() })
          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine whether the tagged commit is on main."
          }
          if ($branches -notcontains "origin/main") {
            throw "Releases may only be created from a commit that is on origin/main."
          }
        } else {
          if ($env:REF_NAME -cne "main") {
            throw "Manual release runs must use the main branch."
          }
          $releaseTag = $env:RELEASE_TAG_INPUT
        }

        & ./.github/scripts/validate-versioning.ps1 -ReleaseTag $releaseTag
        if ($LASTEXITCODE -ne 0) {
          throw "Release metadata validation failed."
        }
        "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

    - name: Test timestamp server
      shell: pwsh
      run: |
        try {
          $response = Invoke-WebRequest -Uri "http://tss.accv.es:8318/tsa" -Method Head
          if ($response.StatusCode -ne 200) {
            Write-Error "Timestamp server is not reachable. Status code: $($response.StatusCode)"
            exit 1
          }
          Write-Output "Timestamp server is reachable."
        } catch {
          Write-Error "Timestamp server test failed."
          exit 1
        }

    - name: Set up .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0.x'

    - name: Install Nerdbank.GitVersioning 
      run: dotnet tool install --global nbgv

    - name: Get version from Nerdbank.GitVersioning
      id: get_version
      run: echo "::set-output name=version::$(nbgv get-version --format json | jq -r .SimpleVersion)"

    - name: Install dependencies
      run: dotnet restore

    - name: Test project
      run: dotnet test BiMaDock.sln --configuration Release

    - name: Build project
      run: dotnet build --configuration Release "-p:ReleaseTag=${{ steps.validate-release.outputs.release_tag }}"

    - name: Publish project
      run: dotnet publish ./BiMaDock.csproj --configuration Release --output ./publish --runtime win-x64 -p:PublishReadyToRun=true "-p:ReleaseTag=${{ steps.validate-release.outputs.release_tag }}"

    - name: Read app version
      shell: pwsh
      run: |
        $version = pwsh -File get_version.ps1
        if ($LASTEXITCODE -ne 0) { throw "Version could not be read from version.json." }
        "APP_VERSION=$version" >> $env:GITHUB_ENV

    - name: Install Windows SDK
      run: choco install windows-sdk-10.1 -y

    - name: Decode certificate
      id: decode-certificate
      continue-on-error: true
      shell: pwsh
      env:
        CERTIFICATE_FILE: ${{ secrets.CERTIFICATE_FILE }}
      run: |
        $certContent = $env:CERTIFICATE_FILE
        if ([string]::IsNullOrWhiteSpace($certContent)) {
          throw "The CERTIFICATE_FILE secret is not configured."
        }
        $certContent | Out-File -FilePath meinzertifikat_base64.txt -Encoding ascii
        certutil -decode meinzertifikat_base64.txt meinzertifikat.pfx
        if ($LASTEXITCODE -ne 0) {
          throw "Could not decode the signing certificate."
        }

    - name: Find and set signtool path
      id: find-signtool
      shell: pwsh
      run: |
        $signtoolPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe | Select-Object -ExpandProperty FullName -First 1
        if ($null -eq $signtoolPath) {
            Write-Error "signtool.exe not found."
            exit 1
        }
        Write-Output "signtool.exe found at: $signtoolPath"
        "signtool_path=$signtoolPath" >> $env:GITHUB_OUTPUT

    - name: Create Windows installer
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "./BiMaDock.iss"

    - name: Sign executable
      id: sign-executable
      continue-on-error: true
      env:
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      run: |
        $path = '${{ steps.find-signtool.outputs.signtool_path }}'
        & "$path" sign /f meinzertifikat.pfx /p $env:CERTIFICATE_PASSWORD /fd SHA256 /tr http://tss.accv.es:8318/tsa /td SHA256 ./publish/BiMaDockSetup.exe
        if ($LASTEXITCODE -ne 0) {
          throw "Code signing failed (exit code $LASTEXITCODE). The installer will be published unsigned."
        }

    - name: Report unsigned installer
      if: steps.decode-certificate.outcome == 'failure' || steps.sign-executable.outcome == 'failure'
      run: Write-Warning "The installer could not be signed and will be published unsigned. Check the CERTIFICATE_FILE and CERTIFICATE_PASSWORD repository secrets."

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: ${{ steps.validate-release.outputs.release_tag }}
        name: "Release ${{ steps.validate-release.outputs.release_tag }}"
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          ./publish/BiMaDockSetup.exe
